openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scripts
    description: YouTube script generation tools
  - name: tools
    description: YouTube channel tools
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scripts/generate:
    post:
      operationId: generateScript
      tags: [scripts]
      summary: Generate a YouTube script with tension engine (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateScriptBody"
      responses:
        "200":
          description: SSE stream of script chunks
          content:
            text/event-stream: {}
  /tools/titles:
    post:
      operationId: generateTitles
      tags: [tools]
      summary: Generate viral YouTube titles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTitlesBody"
      responses:
        "200":
          description: Generated titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateTitlesResponse"
  /tools/seo-bundle:
    post:
      operationId: generateSeoBundle
      tags: [tools]
      summary: Generate a full SEO bundle (titles, description, tags, hashtags) from one topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSeoBundleBody"
      responses:
        "200":
          description: Generated SEO bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSeoBundleResponse"
  /tools/ideas:
    post:
      operationId: generateIdeas
      tags: [tools]
      summary: Generate video ideas for a niche/channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateIdeasBody"
      responses:
        "200":
          description: Generated video ideas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateIdeasResponse"
  /tools/description:
    post:
      operationId: generateDescription
      tags: [tools]
      summary: Generate YouTube video description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDescriptionBody"
      responses:
        "200":
          description: Generated description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateDescriptionResponse"
  /tools/tags:
    post:
      operationId: generateTags
      tags: [tools]
      summary: Generate YouTube tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTagsBody"
      responses:
        "200":
          description: Generated tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateTagsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateScriptBody:
      type: object
      properties:
        topic:
          type: string
        channelStyle:
          type: string
        videoLength:
          type: string
          enum: [100, 800, 1500, 3000]
        tensionLevel:
          type: string
          enum: [low, medium, high, extreme]
        tensionTechniques:
          type: array
          items:
            type: string
        inspirationLinks:
          type: string
        model:
          type: string
      required:
        - topic
        - videoLength
        - tensionLevel
    GenerateTitlesBody:
      type: object
      properties:
        topic:
          type: string
        channelNiche:
          type: string
      required:
        - topic
    TitleScoreBreakdown:
      type: object
      properties:
        length: { type: integer }
        powerWords: { type: integer }
        numbers: { type: integer }
        bracket: { type: integer }
        freshYear: { type: integer }
        emotional: { type: integer }
        casing: { type: integer }
      required:
        - length
        - powerWords
        - numbers
        - bracket
        - freshYear
        - emotional
        - casing
    ScoredTitle:
      type: object
      properties:
        title: { type: string }
        score: { type: integer }
        breakdown: { $ref: "#/components/schemas/TitleScoreBreakdown" }
        warnings:
          type: array
          items:
            type: string
      required:
        - title
        - score
        - breakdown
        - warnings
    GenerateTitlesResponse:
      type: object
      properties:
        titles:
          type: array
          items:
            type: string
        scoredTitles:
          type: array
          items:
            $ref: "#/components/schemas/ScoredTitle"
        dataSource:
          type: string
          nullable: true
      required:
        - titles
    GenerateSeoBundleBody:
      type: object
      properties:
        topic: { type: string }
        channelNiche: { type: string }
      required:
        - topic
    GenerateSeoBundleResponse:
      type: object
      properties:
        titles:
          type: array
          items:
            $ref: "#/components/schemas/ScoredTitle"
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        hashtags:
          type: array
          items: { type: string }
        dataSource:
          type: string
          nullable: true
      required:
        - titles
        - description
        - tags
        - hashtags
    GenerateIdeasBody:
      type: object
      properties:
        channelNiche:
          type: string
        count:
          type: integer
      required:
        - channelNiche
    GenerateIdeasResponse:
      type: object
      properties:
        ideas:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              estimatedViews:
                type: string
            required:
              - title
              - description
              - estimatedViews
      required:
        - ideas
    GenerateDescriptionBody:
      type: object
      properties:
        title:
          type: string
        script:
          type: string
      required:
        - title
    GenerateDescriptionResponse:
      type: object
      properties:
        description:
          type: string
      required:
        - description
    GenerateTagsBody:
      type: object
      properties:
        title:
          type: string
        topic:
          type: string
      required:
        - title
    GenerateTagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
      required:
        - tags
